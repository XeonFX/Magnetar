name: Release

# Every merge to main that changes the app is released as the next patch version (ci.yml calls this workflow once
# its checks pass; scripts/release-version.ts picks the version and skips docs-, test- and CI-only merges).
# A minor or major release is a tag pushed by hand once CI is green on main: git tag v1.3.0 && git push origin v1.3.0.
# The next automatic patch continues from it. A tag with a pre-release (v1.3.0-rc.1) publishes a pre-release, which
# installed apps don't take, and never sets the version of the patches after it. Installed apps update within 6 hours.
on:
  push:
    tags: ['v*']
  workflow_call:

permissions:
  contents: write
  # The release notes read the merged pull requests' titles and branches.
  pull-requests: read

env:
  AWS_LC_SYS_PREBUILT_NASM: '1'
  HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}

jobs:
  # Runs inside ci.yml's serialized release job, so two merges never pick the same version. The version files are
  # not edited by hand any more: the tag is the version, and the executable and the website take it from there.
  plan:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: plan
        env:
          # Set by a tag pushed by hand; a call from ci.yml runs on a branch, where the version is computed.
          PUSHED_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-version.ts plan --sha "$GITHUB_SHA" ${PUSHED_TAG:+--tag "$PUSHED_TAG"}

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          # macOS bundles are signed with codesign, so they build on macOS.
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-14, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          # The oldest supported Ubuntu, so the executable runs on older glibc too.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      # Only when the Developer ID certificate is a secret; without it the build is ad-hoc signed.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      # The x64 macOS build is cross-compiled on an arm64 runner, so its tests can't run there.
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - name: Build
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run build -w @magnetar/client -- --target ${{ matrix.target }} --version ${{ needs.plan.outputs.version }}
      - name: Collect the release asset
        shell: bash
        run: |
          mkdir -p out
          cd apps/client/dist
          if ls *.zip >/dev/null 2>&1; then cp *.zip ../../../out/; else cp Magnetar-* ../../../out/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The tag is made once the builds succeeded, so a failed release leaves no tag and the next merge retries the
      # same version. A tag pushed by hand exists already. (A push with GITHUB_TOKEN starts no other workflow.)
      - name: Tag the commit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd assets && sha256sum Magnetar-* > SHA256SUMS.txt && cd ..
          node scripts/sign-release.ts assets
      # What the release brings, from the pull requests merged since the release before, grouped by their branch's
      # type (feat/ New, fix/ Fixes, perf/ Faster…). The app's changelog and its update notice show these notes.
      # A GitHub hiccup here must not lose the release built above: GitHub's own notes stand in.
      - name: Release notes
        id: notes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: npx --yes -p @codefusion-cc/app-update@^0.1.1 codefusion-release-notes "$TAG" > notes.md && cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: assets/*
          body_path: ${{ steps.notes.outcome == 'success' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outcome != 'success' }}
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
