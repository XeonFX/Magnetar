name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # aws-lc (rustls' crypto) ships assembled objects for Windows; no NASM install needed.
  AWS_LC_SYS_PREBUILT_NASM: '1'
  # Tests need no debugger symbols: less to compile, link and cache.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    name: Lint, types and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the executable for this runner
        run: npm run build -w @magnetar/client -- --version 0.0.0-ci --profile ci
      - name: Smoke-test the executable
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls apps/client/dist/Magnetar-0.0.0-ci-* | grep -v '\.zip$' | head -1)
          export MAGNETAR_DATA_DIRECTORY="$RUNNER_TEMP/magnetar-smoke" MAGNETAR_PORT=47899 MAGNETAR_NO_TRAY=1 MAGNETAR_NO_BROWSER=1
          "$exe" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:47899/health && break; sleep 1; done
          curl -sf http://localhost:47899/ | grep -q '<div id="root">'
          curl -sf http://localhost:47899/app-config.json | grep -q '"local"'
          cat "$RUNNER_TEMP/smoke.log"
      - name: Exercise the tray icon (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          exe=$(ls apps/client/dist/Magnetar-0.0.0-ci-*.exe | head -1)
          export MAGNETAR_DATA_DIRECTORY="$RUNNER_TEMP/magnetar-tray" MAGNETAR_PORT=47898
          "$exe" > "$RUNNER_TEMP/tray.log" 2>&1 &
          sleep 8
          cat "$RUNNER_TEMP/magnetar-tray"/logs/*.log
          grep -q "Notification-area icon ready" "$RUNNER_TEMP/magnetar-tray"/logs/*.log

  e2e:
    name: Dashboard end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/e2e/test-results

  # Every merge to main goes live on magnetar.codefusion.cc once every check above passed, so the website never runs
  # an older build than main. CodeFusion Console reads what runs from the deployed version.json, and the outcome of
  # each deploy from this job's GitHub deployment.
  deploy:
    name: Deploy magnetar.codefusion.cc
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://magnetar.codefusion.cc
    # One deploy at a time, never cancelled once started (it may have migrated the database). Merges that land
    # meanwhile wait; only the newest of them runs.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Require the deploy token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The production environment's CLOUDFLARE_API_TOKEN secret is not set; see docs/DEPLOY.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      # Stamps apps/web/dist/version.json with this commit (GITHUB_SHA), which the console and open pages read.
      - run: npm run build -w @magnetar/web
        working-directory: .
      # Before the Worker, so the new code never meets the old schema. Migrations only add, so the running Worker
      # keeps working on the new one meanwhile.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply magnetar --remote
      - name: Deploy the Worker
        run: npx wrangler deploy --message "${GITHUB_SHA::7} ${GITHUB_EVENT_NAME} by ${GITHUB_ACTOR}"
      - name: The website serves this commit
        run: |
          for attempt in $(seq 1 12); do
            deployed="$(curl -sf -H 'cache-control: no-cache' "https://magnetar.codefusion.cc/version.json?$attempt" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).commit' || true)"
            case "$GITHUB_SHA" in "$deployed"*) [ -n "$deployed" ] && echo "Live: $deployed" && exit 0 ;; esac
            echo "Still serving ${deployed:-nothing}; waiting"
            sleep 5
          done
          echo "::error::magnetar.codefusion.cc does not serve ${GITHUB_SHA::7} a minute after the deploy"
          exit 1
