name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Build the executable for this runner
        run: bun run --cwd apps/client build --version 0.0.0-ci
      - name: Smoke-test the executable
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls apps/client/dist/MediaDownloader-0.0.0-ci-* | grep -v '\.zip$' | head -1)
          export MD_DATA_DIRECTORY="$RUNNER_TEMP/md-smoke" MD_PORT=47899 MD_NO_TRAY=1 MD_NO_BROWSER=1
          "$exe" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:47899/health && break; sleep 1; done
          curl -sf http://localhost:47899/ | grep -q '<div id="root">'
          curl -sf http://localhost:47899/app-config.json | grep -q '"local"'
          cat "$RUNNER_TEMP/smoke.log"
      - name: Exercise the tray icon (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          exe=$(ls apps/client/dist/MediaDownloader-0.0.0-ci-*.exe | head -1)
          export MD_DATA_DIRECTORY="$RUNNER_TEMP/md-tray" MD_PORT=47898
          "$exe" > "$RUNNER_TEMP/tray.log" 2>&1 &
          sleep 8
          cat "$RUNNER_TEMP/md-tray"/logs/*.log
          grep -q "Notification-area icon ready" "$RUNNER_TEMP/md-tray"/logs/*.log
