name: Provider health

# Parsers are tested against captured pages; this catches a site changing its markup or blocking us.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: MD_LIVE_TESTS=1 cargo test --locked --test providers live_providers
